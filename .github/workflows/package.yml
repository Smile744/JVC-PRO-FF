name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev binfmt-support

      - name: Install Buildozer
        run: |
          pip install --upgrade Cython==0.29.33 virtualenv buildozer

      - name: Create Spec File
        run: |
          buildozer init
          sed -i 's/^title = .*/title = JVC-PRO FF/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = jvcproff/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.jvc/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^android.permissions = .*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,moe.shizuku.manager.permission.API_V23/' buildozer.spec

      - name: Build with Buildozer
        run: |
          # Forzamos a Buildozer a descargar el SDK base primero
          buildozer android help || true
          
          # Inyectamos las licencias en la ruta que Buildozer ya creó
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "247a1c6d50f8de50a7131974f1a545fc8bac4745\n27208515a26ee721da507e2133880a9293e42e1d\n35ab0213794b1509177114b7264a2b9f3906e579" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Compilamos la aplicación normalmente
          buildozer --verbose android debug
