name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c

      - name: Setup Java
        uses: actions/setup-java@3f870313ef374a9d70fa7c8ff7e39405b76f273e
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev binfmt-support

      - name: Install Buildozer
        run: |
          pip install --upgrade Cython==0.29.33 virtualenv buildozer

      - name: Create Spec File
        run: |
          buildozer init
          sed -i 's/^title = .*/title = JVC-PRO FF/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = jvcproff/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.jvc/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@0b7f1b6c321a07b16de2de114d915a271d54d19d
        with:
          name: JVC-PRO-FF-APK
          path: bin/*.apk
