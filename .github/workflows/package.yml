name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev binfmt-support

      - name: Install Buildozer
        run: |
          pip install --upgrade Cython==0.29.33 virtualenv buildozer

      - name: Create Spec File
        run: |
          buildozer init
          sed -i 's/^title = .*/title = JVC-PRO FF/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = jvcproff/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.jvc/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^android.permissions = .*/android.permissions = INTERNET,WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE,moe.shizuku.manager.permission.API_V23/' buildozer.spec

      - name: Build with Buildozer
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android clean
          yes | buildozer --verbose android debug
