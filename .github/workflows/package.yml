name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Java
        uses: actions/setup-java@387a412e430db80d22d7ef110ed11d86689d366a
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev binfmt-support

      - name: Install Buildozer
        run: |
          pip install --upgrade Cython==0.29.33 virtualenv buildozer

      - name: Create Spec File
        run: |
          buildozer init
          sed -i 's/^title = .*/title = JVC-PRO FF/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = jvcproff/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.jvc/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf659b1a429527f9a66e
        with:
          name: JVC-PRO-FF-APK
          path: bin/*.apk
