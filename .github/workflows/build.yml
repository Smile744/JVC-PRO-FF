name: Compilar APK JVC-PRO FF
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev binfmt-support

      - name: Instalar Buildozer
        run: |
          pip install --upgrade Cython==0.29.33 virtualenv buildozer

      - name: Compilar APK
        run: |
          yes | buildozer -v android debug

      - name: Subir APK
        uses: actions/upload-artifact@v3
        with:
          name: JVC-PRO-FF-APK
          path: bin/*.apk
